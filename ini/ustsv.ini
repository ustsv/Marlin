#
# Marlin Firmware
# PlatformIO Configuration File
#
##define CUSTOM_MACHINE_NAME "Ustsv3D Printer"
##define MACHINE_UUID "342fdf0d-3633-4a00-93e4-73132be36518"
#//#define SERIAL_PORT 0
##define BAUDRATE 115200

[platformio]
name = "Marlin"
description = "Marlin for ustsv"
default_envs =RP2040_ustsv
workspace_dir = ${sysenv.TMP}/Marlin/
lib_dir       = ${sysenv.TMP}/Marlin/lib
#cache_dir = ${sysenv.TMP}/Marlin/cache_dir
#build_cache_dir = ${sysenv.TMP}/Marlin/build_cache_dir

[common_ustsv]
build_flags	=
  -DCUSTOM_MACHINE_NAME=\"Ustsv3D_Printer\"
  -DMACHINE_UUID=\"342fdf0d-3633-4a00-93e4-73132be36518\"
#
# ATmega2560
#
[env:mega2560_ustsv]
extends  = env:mega2560
platform = atmelavr
#Version         Size     Published
#--------------  -------  -------------------
#3.70300.220127  49.91MB  2022-01-26 15:33:19
#1.70300.191015  50.66MB  2019-10-16 07:52:43
#1.50400.190710  41.39MB  2019-07-10 08:56:01
platform_packages = toolchain-atmelavr@3.70300.220127
build_flags         = ${env:mega2560.build_flags} 
  -DREPRAP_DISCOUNT_SMART_CONTROLLER
  -DSERIAL_PORT=0
  -DBAUDRATE=115200
  -DSERIAL_USB
  ${common_ustsv.build_flags}
#lib_ignore          = SoftwareSerialM

#
# YD-RP2040
#
[env:RP2040_ustsv]
extends          = env:RP2040
#platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git
platform_packages = toolchain-gccarmnoneeabi@1.120301.0 # INFO: Ok
#board_build.core = earlephilhower
build_flags      = ${env:RP2040.build_flags}
  -DMOTHERBOARD=BOARD_RP2040
  -DSERIAL_PORT=1
  -DBAUDRATE=115200
  -DSERIAL_USB
  ${common_ustsv.build_flags}
monitor_speed = 115200

#
# morpheus (STM32F103CB)
#
[env:morpheus_ustsv]
platform    = ststm32
board       = genericSTM32F103CB
board_build.core = maple
#Version          Size      Published
#---------------  --------  -------------------
#1.120301.0       242.22MB  2023-09-22 12:46:29 # BUG: reference to 'byte' is ambiguous
#1.100301.220327  157.82MB  2022-03-27 19:55:40 # BUG: reference to 'byte' is ambiguous
#1.90301.200702   134.59MB  2020-08-13 10:25:16 # BUG: reference to 'byte' is ambiguous
#1.90201.191206   129.24MB  2020-02-07 16:46:43 # BUG: reference to 'byte' is ambiguous
#1.50401.190816   54.00MB   2019-08-16 20:21:57
#1.80201.181220   117.02MB  2019-03-02 14:21:32 # BUG: reference to 'byte' is ambiguous
#1.70201.0        108.55MB  2019-02-15 14:38:15 # INFO: default Ok
#1.60301.0        86.09MB   2017-07-10 16:30:04
#1.40804.0        63.79MB   2016-05-25 15:03:08
#platform_packages = toolchain-gccarmnoneeabi@1.80201.181220
build_flags = !python buildroot/share/PlatformIO/scripts/STM32F1_build_flags.py -c -w -std=c++17 -std=gnu++17
  -ffunction-sections -fdata-sections -nostdlib -fno-threadsafe-statics -fno-rtti -fno-exceptions -fno-use-cxa-atexit -Wl,--gc-sections
  -DMOTHERBOARD=BOARD_MORPHEUS
  -DSERIAL_PORT=-1
#  -DBAUDRATE=115200
  -DSERIAL_USB
  -DSLIM_LCD_MENUS
  -DLCD_SAINSMART_I2C_1602
  -DDEBUG_LEVEL=0
  ${common.build_flags}
  ${common_ustsv.build_flags}
build_src_filter  = ${common.default_src_filter} +<src/HAL/STM32F1>
lib_ignore  = Adafruit NeoPixel, LiquidTWI2, TMCStepper, U8glib-HAL, SPI, SoftwareSerialM
build_unflags = -std=gnu++11
monitor_speed = 115200
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/tool-stm32duino/stlink/ST-LINK_CLI.exe -ME -V -P $SOURCE 0x8000000 -Rst

[env:test]
extends = env:STM32F1_maple
#extends = env:STM32F103CB_malyan_maple
board       = marlin_malyanM200
platform = ststm32
platform_packages = tool-stm32duino
#  toolchain-gccarmnoneeabi@1.120301.0
board_build.core  = maple
build_type  = release
build_flags = ${env:STM32F103CB_malyan_maple.build_flags}
  -DMOTHERBOARD=BOARD_MORPHEUS
  -DSERIAL_PORT=-1
  -DSERIAL_USB
build_unflags = ${env:STM32F103CB_malyan_maple.build_unflags} -std=gnu++11 -std=gnu++14 -std=c++1y
lib_ignore  = ${env:STM32F103CB_malyan_maple.lib_ignore}, Adafruit NeoPixel, LiquidTWI2, TMCStepper, U8glib-HAL, SPI, SoftwareSerialM
#build_flags = !python buildroot/share/PlatformIO/scripts/STM32F1_build_flags.py
#  -DMCU_STM32F103CB -D__STM32F1__=1 -ffunction-sections -fdata-sections
#  -Wl,--gc-sections -DDEBUG_LEVEL=0
#  ${common.build_flags}
#build_unflags     = -std=gnu11 -std=gnu++11
build_src_filter  = ${common.default_src_filter} +<src/HAL/STM32F1>
#lib_ignore        = SPI, FreeRTOS701, FreeRTOS821, SoftwareSerialM
lib_deps          = ${common.lib_deps}
                    SoftwareSerialM
extra_scripts     = ${common.extra_scripts}
                    pre:buildroot/share/PlatformIO/scripts/fix_framework_weakness.py
                    pre:buildroot/share/PlatformIO/scripts/stm32_serialbuffer.py
                        buildroot/share/PlatformIO/scripts/custom_board.py
                        buildroot/share/PlatformIO/scripts/offset_and_rename.py
custom_marlin.HAS_SPI_TFT     = build_src_filter=+<src/HAL/STM32F1/tft/tft_spi.cpp>
custom_marlin.HAS_TFT_XPT2046 = build_src_filter=+<src/HAL/STM32F1/tft/xpt2046.cpp>
custom_marlin.HAS_FSMC_TFT    = build_src_filter=+<src/HAL/STM32F1/tft/tft_fsmc.cpp>

#
# Simulator for Windows 10
#
#  MSYS2 mingw-w64-x86_64 with these packages:
#   pacman -S --needed base-devel mingw-w64-x86_64-toolchain mingw64/mingw-w64-x86_64-glm mingw64/mingw-w64-x86_64-SDL2 mingw64/mingw-w64-x86_64-SDL2_net mingw-w64-x86_64-dlfcn
#
#  Ensure the following paths have been added to the PATH system environment variable:
#   C:\msys64\mingw64\bin, C:\msys64\ucrt64\bin, C:\msys64\usr\bin
#
[env:sim_ustsv]
extends         = env:simulator_windows
build_flags     = ${env:simulator_windows.build_flags}
  -DMOTHERBOARD=BOARD_SIMULATED 
  -DSERIAL_PORT=0
	-IC:/msys2/mingw64/include/SDL2
	${common_ustsv.build_flags}
build_type      = release
